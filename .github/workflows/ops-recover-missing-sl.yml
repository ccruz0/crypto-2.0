# Ops: recreate missing / under-covered STOP_LOSS after TP-only recovery.
# Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Do NOT pass --tp-only (that skips SL recreate after --cancel-sl-first).
name: Ops — recover missing SLs

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, only dry-run SL recovery"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      symbols:
        description: "Space-separated symbols for SL recovery"
        required: false
        default: "ALGO_USD"

permissions:
  contents: read

jobs:
  recover-missing-sls:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      # AWS-RunShellScript uses /bin/sh. Avoid docker --format '{{.Names}}'.
      - name: Dry-run recover_missing_tps (SL allowed)
        env:
          INSTANCE_ID: i-087953603011543c5
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          set -euo pipefail
          SYMBOLS="${SYMBOLS:-ALGO_USD}"
          case "$SYMBOLS" in
            *[!A-Za-z0-9_\ ]*) echo "Invalid symbols input: $SYMBOLS" >&2; exit 1 ;;
          esac
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          # Prefer host-mounted /repo script (compose mounts .:/repo:ro) so this
          # workflow picks up undercoverage fix without waiting for ECR rebuild.
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          # Script imports app from /repo/backend (sys.path); pull SL gap-fill reuse fix too.
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            backend/scripts/recover_missing_tps.py \
            backend/app/services/tp_sl_order_creator.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" python3 /repo/backend/scripts/recover_missing_tps.py ${SYMBOLS}
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "dry-run recover_missing_sl" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"

      - name: Live recover_missing_tps (create missing SLs)
        if: ${{ github.event.inputs.dry_run_only != 'true' }}
        env:
          INSTANCE_ID: i-087953603011543c5
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          set -euo pipefail
          SYMBOLS="${SYMBOLS:-ALGO_USD}"
          case "$SYMBOLS" in
            *[!A-Za-z0-9_\ ]*) echo "Invalid symbols input: $SYMBOLS" >&2; exit 1 ;;
          esac
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            backend/scripts/recover_missing_tps.py \
            backend/app/services/tp_sl_order_creator.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          # No --tp-only: must recreate SLs. No --cancel-sl-first: keep existing SL legs.
          docker exec "\$CONTAINER" python3 /repo/backend/scripts/recover_missing_tps.py --live ${SYMBOLS}
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "live recover_missing_sl" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
