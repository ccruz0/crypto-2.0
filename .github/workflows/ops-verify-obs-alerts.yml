# Verify InstanceDown 15m + telegram throttle on PROD; reload Prometheus.
# Does NOT touch backend/frontend/trading.
name: Ops verify obs alerts (SSM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-verify-obs-alerts.yml"
      - "scripts/aws/verify_obs_alerts_reload.sh"
      - "scripts/aws/observability/telegram-alerts/Dockerfile"
      - "scripts/aws/observability/alerts.yml"

concurrency:
  group: atp-obs-verify-reload
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-reload:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify alerts + throttle; reload Prometheus
        env:
          INSTANCE_ID: i-087953603011543c5
        run: |
          set -euo pipefail
          # Single bash -lc so AWS-RunShellScript (/bin/sh) never sees pipefail.
          # chown .git first: root-owned objects break ubuntu fetch (seen on 9477b48b).
          # Inline fallback if host tip lacks verify_obs_alerts_reload.sh.
          REMOTE=$(cat <<'REMOTE_EOF'
          set -eu
          cd /home/ubuntu/crypto-2.0
          if [ -d .git ]; then sudo chown -R ubuntu:ubuntu .git || true; fi
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 reset --hard origin/main
          if [ -x scripts/aws/verify_obs_alerts_reload.sh ] || [ -f scripts/aws/verify_obs_alerts_reload.sh ]; then
            bash scripts/aws/verify_obs_alerts_reload.sh
          else
            echo "host script missing after reset; running inline fallback"
            set -euo pipefail
            echo "GIT_HEAD=$(sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 rev-parse --short HEAD)"
            grep -nE "alert: InstanceDown|for: " scripts/aws/observability/alerts.yml | head -20
            grep -qE "for:[[:space:]]*15m" scripts/aws/observability/alerts.yml
            test -f scripts/aws/observability/telegram-alerts/throttle.py && echo THROTTLE_FILE=ok
            docker compose --profile aws build telegram-alerts
            docker compose --profile aws up -d --no-deps --force-recreate telegram-alerts
            sleep 3
            docker inspect -f "telegram={{.State.Status}} started={{.State.StartedAt}}" atp-telegram-alerts
            curl -sS -o /dev/null -w "http=%{http_code}\n" -X POST http://127.0.0.1:9090/-/reload || docker kill -s HUP atp-prometheus
            sleep 2
            curl -sS http://127.0.0.1:9090/api/v1/rules | python3 -c "import sys,json;d=json.load(sys.stdin);found=False
for g in d.get('data',{}).get('groups',[]):
  for r in g.get('rules',[]):
    if r.get('name')=='InstanceDown':
      found=True; print('RULE',r.get('name'),'duration',r.get('duration'),'state',r.get('state'))
assert found"
            docker exec atp-prometheus sh -c "grep -nE 'InstanceDown|for:' /etc/prometheus/alerts.yml | head -10"
            echo DONE_OBS_VERIFY
          fi
          REMOTE_EOF
          )
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command             --instance-ids "$INSTANCE_ID"             --document-name "AWS-RunShellScript"             --parameters "$PARAMS"             --comment "obs verify reload InstanceDown 15m + telegram-alerts"             --timeout-seconds 300             --region ap-southeast-1             --output text             --query "Command.CommandId")
          echo "SSM CommandId=$COMMAND_ID"
          for i in $(seq 1 50); do
            STATUS=$(aws ssm get-command-invocation               --command-id "$COMMAND_ID"               --instance-id "$INSTANCE_ID"               --region ap-southeast-1               --query Status --output text 2>/dev/null || echo InProgress)
            echo "poll $i status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --region ap-southeast-1             --query StandardOutputContent --output text
          echo "===== STDERR ====="
          aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --region ap-southeast-1             --query StandardErrorContent --output text
          FINAL=$(aws ssm get-command-invocation             --command-id "$COMMAND_ID"             --instance-id "$INSTANCE_ID"             --region ap-southeast-1             --query Status --output text)
          test "$FINAL" = "Success"
