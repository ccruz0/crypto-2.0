# Verify InstanceDown 15m + telegram throttle on PROD; reload Prometheus.
# Does NOT touch backend/frontend/trading.
name: Ops verify obs alerts (SSM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-verify-obs-alerts.yml"
      - "scripts/aws/verify_obs_alerts_reload.sh"
      - "scripts/aws/observability/telegram-alerts/Dockerfile"
      - "scripts/aws/observability/alerts.yml"

concurrency:
  group: atp-obs-verify-reload
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  verify-and-reload:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify alerts + throttle; reload Prometheus
        env:
          INSTANCE_ID: i-087953603011543c5
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ubuntu/crypto-2.0","sudo -u ubuntu git fetch origin main","sudo -u ubuntu git reset --hard origin/main","bash scripts/aws/verify_obs_alerts_reload.sh"]' \
            --timeout-seconds 300 \
            --region ap-southeast-1 \
            --output text \
            --query "Command.CommandId")
          echo "SSM CommandId=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-southeast-1 \
              --query Status --output text 2>/dev/null || echo InProgress)
            echo "poll $i status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardOutputContent --output text
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardErrorContent --output text
          FINAL=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query Status --output text)
          test "$FINAL" = "Success"
