# Verify InstanceDown 15m + telegram throttle on PROD; reload Prometheus.
# Does NOT touch backend/frontend/trading. Safe after scripts sync (#630/#616).
name: Ops verify obs alerts (SSM)

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to AWS EC2 (Session Manager)"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - ".github/workflows/ops-verify-obs-alerts.yml"
      - "scripts/aws/observability/telegram-alerts/Dockerfile"
      - "scripts/aws/observability/alerts.yml"

# Separate from atp-prod-ec2-deploy so verify is not blocked by production-gate waits.
concurrency:
  group: atp-obs-verify-reload
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  actions: read

jobs:
  verify-and-reload:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Verify alerts + throttle; reload Prometheus
        env:
          INSTANCE_ID: i-087953603011543c5
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -euo pipefail",
              "cd /home/ubuntu/crypto-2.0",
              "sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main",
              "sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 reset --hard origin/main",
              "echo GIT_HEAD=$(sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 rev-parse --short HEAD)",
              "echo === alerts.yml InstanceDown ===",
              "grep -nE \"alert: InstanceDown|for: |more than\" scripts/aws/observability/alerts.yml | head -20",
              "test -f scripts/aws/observability/telegram-alerts/throttle.py && echo THROTTLE_FILE=ok || (echo THROTTLE_FILE=MISSING && exit 1)",
              "grep -nE \"filter_alerts_for_telegram|from throttle\" scripts/aws/observability/telegram-alerts/server.py",
              "grep -nE \"COPY .*throttle|COPY server\" scripts/aws/observability/telegram-alerts/Dockerfile",
              "echo === health_snapshot transient throttle ===",
              "grep -nE \"ATP_HEALTH_MIN_FAIL_MINUTES|transient flap|action_required_skipped\" scripts/diag/health_snapshot_telegram_alert.sh | head -10",
              "echo === cutover TRANSIENT ===",
              "grep -nE \"TRANSIENT|transient_suppress\" scripts/aws/run_github_app_cutover_monitor_with_alerts.sh scripts/aws/_github_app_cutover_alert_lib.sh 2>/dev/null | head -15 || true",
              "echo === rebuild telegram-alerts ===",
              "docker compose --profile aws build telegram-alerts",
              "docker compose --profile aws up -d --no-deps telegram-alerts",
              "sleep 3",
              "docker inspect -f \"{{.State.Status}} {{.State.Running}}\" atp-telegram-alerts",
              "echo === prometheus reload ===",
              "curl -sS -o /dev/null -w \"http=%{http_code}\\n\" -X POST http://127.0.0.1:9090/-/reload || docker kill -s HUP atp-prometheus",
              "sleep 2",
              "echo === prometheus rules InstanceDown ===",
              "curl -sS http://127.0.0.1:9090/api/v1/rules | python3 -c \"import sys,json;d=json.load(sys.stdin);\\n[print(\\\"RULE\\\",r.get(\\\"name\\\"),\\\"duration\\\",r.get(\\\"duration\\\"),\\\"state\\\",r.get(\\\"state\\\")) for g in d.get(\\\"data\\\",{}).get(\\\"groups\\\",[]) for r in g.get(\\\"rules\\\",[]) if r.get(\\\"name\\\")==\\\"InstanceDown\\\"]\"",
              "echo === alerts.yml inside prometheus container ===",
              "docker exec atp-prometheus sh -c \"grep -nE \\\"InstanceDown|for:\\\" /etc/prometheus/alerts.yml | head -10\"",
              "echo DONE_OBS_VERIFY"
            ]' \
            --timeout-seconds 300 \
            --region ap-southeast-1 \
            --output text \
            --query "Command.CommandId")
          echo "SSM CommandId=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-southeast-1 \
              --query Status --output text 2>/dev/null || echo InProgress)
            echo "poll $i status=$STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
              *) sleep 5 ;;
            esac
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardOutputContent --output text
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardErrorContent --output text
          FINAL=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query Status --output text)
          test "$FINAL" = "Success"
