# Ops: Phase 1b hybrid Auto ML retrain on prod (trade_outcomes + alert fallback).
# Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
# Human-gated: workflow_dispatch only. Defaults to dry-run (no promote).
# Live promote: dispatch with dry_run_only=false (still no --force-promote).
name: Ops — Auto ML hybrid retrain

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, build/train decision only (no current.joblib promote)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      days:
        description: "Lookback days for alerts/outcomes"
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  auto-ml-hybrid-retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Hybrid retrain on prod host
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            PROMOTE_ENV="AUTO_ML_AUTONOMOUS_PROMOTE=false"
            EXTRA_FLAGS="--dry-run"
          else
            PROMOTE_ENV="AUTO_ML_AUTONOMOUS_PROMOTE=true"
            EXTRA_FLAGS=""
          fi
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            scripts/auto_ml_features.py \
            scripts/build_auto_ml_dataset.py \
            scripts/build_trade_outcomes.py \
            scripts/retrain_and_promote_auto_entry.py \
            scripts/train_auto_entry_model.py \
            scripts/requirements-auto-ml.txt \
            backend/app/services/auto_entry_model.py \
            backend/app/services/auto_entry_promote.py \
            docs/runbooks/auto_ml_entry.md
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" bash -lc "set -euo pipefail; cd /repo; python3 scripts/build_trade_outcomes.py --database-url \"\$DATABASE_URL\" --days ${DAYS} || true; ${PROMOTE_ENV} python3 scripts/retrain_and_promote_auto_entry.py --database-url \"\$DATABASE_URL\" --days ${DAYS} --label-source hybrid --out-dir /data/auto_ml --dataset-out /tmp/auto-ml-dataset-hybrid.json --no-telegram ${EXTRA_FLAGS}; python3 -c \"import json;from pathlib import Path;p=Path('/tmp/auto-ml-dataset-hybrid.json');m=json.loads(p.read_text()).get('meta',{}) if p.exists() else {};print('DATASET_META',{k:m.get(k) for k in ('label_source','phase','n_dataset_rows','n_from_trade_outcome','n_from_alert','n_positive','n_negative')});man=Path('/data/auto_ml/manifest.json');print('MANIFEST_VERSION', json.loads(man.read_text()).get('version') if man.exists() else None)\""
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Auto ML hybrid retrain dry_run=${DRY_RUN} days=${DAYS}" \
            --parameters "$PARAMS" \
            --timeout-seconds 1200 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
