# Ops: vigilante de frescura de trade_outcomes.
#
# POR QUE EXISTE (2026-08-28):
# El 27-ago el cron diario de las 04:30 no corrio (GitHub puede descartar
# runs programados bajo carga) y NADA lo detecto: la tabla estuvo congelada
# y el unico sintoma fue que alguien la miro a mano. El workflow diario
# verifica el exit code del SSM, no el resultado; "upserted: 0" sale verde,
# y una corrida saltada ni siquiera produce un run que pueda salir rojo.
# Este workflow es el vigilante del vigilante.
#
# QUE COMPRUEBA: max(updated_at) de trade_outcomes contra un umbral de 26h.
# El upsert diario refresca updated_at de TODAS las filas de la ventana
# aunque no haya cierres nuevos (ON CONFLICT DO UPDATE), asi que la marca
# avanza en cada corrida sana. Umbral 26h = cadencia diaria + margen del
# scheduler de GitHub (retrasos de ~30 min son normales).
# NO usa max(exit_ts): dias sin operar darian falsa alarma.
#
# QUE NO HACE: no escribe nada, no reconstruye nada, no reintenta el job
# caido. Solo falla en rojo para que se vea.

name: Ops — vigilante frescura trade_outcomes

on:
  schedule:
    # 06:30 UTC: dos horas despues del rebuild diario (04:30), fuera de su
    # ventana de retrasos habituales.
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: trade-outcomes-freshness
  cancel-in-progress: false

jobs:
  check-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Check trade_outcomes freshness on prod host
        env:
          INSTANCE_ID: i-087953603011543c5
          MAX_AGE_HOURS: "26"
        run: |
          set -euo pipefail
          REMOTE=$(cat <<EOF
          set -eu
          PW=\$(docker exec postgres_hardened printenv POSTGRES_PASSWORD)
          AGE_H=\$(docker exec -e PGPASSWORD="\$PW" postgres_hardened psql -U trader -d atp -t -A -c "SELECT COALESCE(EXTRACT(EPOCH FROM (now() - max(updated_at)))/3600.0, 99999) FROM trade_outcomes;")
          echo "trade_outcomes max(updated_at) age: \${AGE_H}h (umbral ${MAX_AGE_HOURS}h)"
          awk -v age="\$AGE_H" -v max="${MAX_AGE_HOURS}" 'BEGIN { exit (age+0 <= max+0) ? 0 : 1 }' || { echo "STALE: la tabla lleva \${AGE_H}h sin escribirse; el rebuild diario no ha corrido o no ha escrito"; exit 1; }
          echo "FRESH"
          EOF
          )
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "trade_outcomes freshness check event=${{ github.event_name }}" \
            --parameters "$PARAMS" \
            --timeout-seconds 120 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"

          for i in $(seq 1 30); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "SSM status=$STATUS"; break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text | tail -10
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text | tail -10

          FINAL=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "Final status: $FINAL"
          test "$FINAL" = "Success"
