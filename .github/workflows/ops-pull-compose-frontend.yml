# Ops: git pull latest compose on prod + recreate frontend-aws (picks up env_file changes).
# Requires repo secrets: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY.
name: Ops — pull compose + frontend-aws

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-compose-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Git pull + recreate frontend-aws via SSM
        env:
          INSTANCE_ID: i-087953603011543c5
          COMPOSE_DIR: /home/ubuntu/crypto-2.0
        run: |
          set -euo pipefail
          read -r -d '' REMOTE <<EOF || true
          set -eu
          COMPOSE_DIR="${COMPOSE_DIR}"
          cd "\$COMPOSE_DIR"
          echo "=== git pull ==="
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
          echo "=== compose frontend-aws env (grep runtime.env) ==="
          grep -A6 'frontend-aws:' docker-compose.yml | head -20 || true
          grep 'runtime.env' docker-compose.yml | head -5 || true
          echo "=== BEFORE ==="
          docker compose --profile aws ps frontend-aws || true
          REGION=ap-southeast-1
          REGISTRY=634531197711.dkr.ecr.ap-southeast-1.amazonaws.com
          IMAGE_URI="\${REGISTRY}/atp-frontend:latest"
          if [ -f .env ] && grep -q '^FRONTEND_IMAGE=' .env; then
            IMAGE_URI=\$(grep '^FRONTEND_IMAGE=' .env | tail -1 | cut -d= -f2-)
          fi
          echo "=== ECR login + pull \${IMAGE_URI} ==="
          aws ecr get-login-password --region "\$REGION" | docker login --username AWS --password-stdin "\$REGISTRY"
          docker pull "\$IMAGE_URI"
          echo "=== Recreate frontend-aws ==="
          IMAGE="\$IMAGE_URI" docker compose --profile aws up -d --no-deps frontend-aws
          ok=0
          for i in \$(seq 1 30); do
            code=\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ 2>/dev/null || echo 000)
            echo "probe \$i http_code=\$code"
            if [ "\$code" = "200" ] || [ "\$code" = "304" ]; then ok=1; break; fi
            sleep 2
          done
          echo ""
          echo "=== AFTER ==="
          docker compose --profile aws ps frontend-aws || true
          echo "=== internal-api route smoke (expect 403 without body) ==="
          curl -sS -o /dev/null -w "internal-api POST http_code=%{http_code}\n" \
            -X POST http://127.0.0.1:3000/internal-api/orders/create-protection-smart \
            -H 'Content-Type: application/json' -d '{}' || true
          if [ "\$ok" != "1" ]; then
            echo "FAIL: frontend not healthy on :3000"
            exit 1
          fi
          echo "OK: compose pulled and frontend-aws recreated"
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "git pull compose + recreate frontend-aws" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          STATUS=InProgress
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
