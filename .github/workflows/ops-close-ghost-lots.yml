# Ops: cerrar en LIBROS los ghost lots del bot (APT 02/03-ago) insertando
# stubs STUB-CLOSED-* — el precedente del 25-jul, verificado empiricamente el
# 30-ago (0 de aquellos 14 padres sigue en open lots).
# NO toca el exchange: solo INSERT en exchange_orders.
# dry_run_only=true POR DEFECTO: este workflow escribe en la base con --live.
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN.
name: Ops — cerrar ghost lots en libros

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "true = solo plan, sin insertar (por defecto). false = INSERTA."
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  close-ghost-lots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Close ghost lots on prod (books only)
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
        run: |
          set -euo pipefail
          LIVE_FLAG=""
          if [ "$DRY_RUN" = "false" ]; then
            LIVE_FLAG="--live"
          fi
          read -r -d '' REMOTE <<EOF || true
          set -eu
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            backend/scripts/close_ghost_lots_2026_08_30.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          docker exec -e PYTHONPATH=/repo/backend "\$CONTAINER" \
            python3 /repo/backend/scripts/close_ghost_lots_2026_08_30.py ${LIVE_FLAG}
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "close ghost lots dry_run=${DRY_RUN}" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
