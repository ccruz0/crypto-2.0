# Ops: read-only diagnose of Auto ML fill feature degradation on prod.
# Human-gated: workflow_dispatch only. No promote, no model write.
name: Ops — Auto ML fill feature diag

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Lookback days for COMPLETE fills"
        required: false
        default: "90"
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  auto-ml-fill-diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Fill feature diag on prod host
        env:
          INSTANCE_ID: i-087953603011543c5
          DAYS: ${{ github.event.inputs.days }}
        run: |
          set -euo pipefail
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            scripts/diag_auto_ml_fill_features.py \
            scripts/auto_ml_features.py \
            scripts/build_auto_ml_dataset.py \
            scripts/alert_quality_metrics.py \
            scripts/eval_alert_quality.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" bash -lc 'set -euo pipefail; cd /repo; python3 scripts/diag_auto_ml_fill_features.py --database-url "\$DATABASE_URL" --days ${DAYS} --sample 5'
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Auto ML fill feature diag days=${DAYS}" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
