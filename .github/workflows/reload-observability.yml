# Reload observability on PROD without laptop AWS SSO.
# Syncs alerts/throttle from main, rebuilds telegram-alerts only, reloads Prometheus rules.
# Does NOT restart backend-aws, market-updater, frontend-aws, or trading containers.
#
# OIDC: production-gate holds environment:production reviewer approval; the reload job
# must NOT set environment so the JWT sub stays repo:...:ref:refs/heads/main (IAM trust).
name: Ops — reload observability (SSM)

on:
  workflow_dispatch:

# Separate from atp-prod-ec2-deploy — no full compose rebuild; must not queue behind Session Manager.
concurrency:
  group: atp-obs-reload
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  production-gate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Production approved
        run: echo "production environment approved"

  reload-observability:
    needs: production-gate
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Reload observability on EC2 via SSM
        env:
          REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMPOSE_DIR: ${{ vars.COMPOSE_DIR }}
        run: |
          set -euo pipefail
          read -r -d '' REMOTE <<EOF || true
          set -eu
          COMPOSE_DIR="${COMPOSE_DIR}"
          cd "\${COMPOSE_DIR}" || { echo "COMPOSE_DIR missing: \${COMPOSE_DIR}"; exit 1; }
          if [ -d .git ]; then sudo chown -R ubuntu:ubuntu .git || true; fi
          # Los contenedores escriben en estas dos carpetas como UID 10001 y dejan
          # ficheros RASTREADOS que ubuntu no puede reescribir, asi que el reset de
          # abajo aborta con Permission denied. Medido el 5-sep-2026: de 37 ficheros
          # que no son de ubuntu, solo 5 estan rastreados y todos viven aqui.
          # Se regenera solo -- reaparecieron 90 min despues de un chown manual --
          # asi que hay que rehacerlo en cada pasada, no una vez.
          # secrets/ queda FUERA a proposito: no bloquea (su contenido coincide con
          # HEAD, git no lo toca) y cambiarle la propiedad no es cosa de un script
          # de observabilidad.
          # El directorio, para que git pueda crear y reemplazar entradas dentro.
          sudo chown ubuntu:ubuntu docs/agents/generated-notes models/auto_entry 2>/dev/null || true
          # Y SOLO los ficheros rastreados. Nada de chown -R: los artefactos
          # ignorados (models/auto_entry/*.joblib) conservan su propietario, que
          # es lo que senalo Cursor Bugbot en la PR #669. Hoy los contenedores
          # corren como root y les daria igual -- verificado con una escritura
          # real en /data/auto_ml -- pero eso puede cambiar y el reset no
          # necesita tocarlos.
          sudo -u ubuntu git -C "\${COMPOSE_DIR}" ls-files -z -- docs/agents/generated-notes models/auto_entry 2>/dev/null | sudo xargs -0 -r chown ubuntu:ubuntu 2>/dev/null || true
          sudo -u ubuntu git -C "\${COMPOSE_DIR}" fetch origin main
          sudo -u ubuntu git -C "\${COMPOSE_DIR}" reset --hard origin/main
          echo "GIT_HEAD=\$(sudo -u ubuntu git -C "\${COMPOSE_DIR}" rev-parse --short HEAD)"
          test -f scripts/aws/verify_obs_alerts_reload.sh
          export ATP_REPO_ROOT="\${COMPOSE_DIR}"
          bash scripts/aws/verify_obs_alerts_reload.sh
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          CMD_ID=$(aws ssm send-command \
            --region "$REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "reload observability: InstanceDown 15m + telegram-alerts + prometheus reload" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          STATUS="Pending"
          for i in $(seq 1 50); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled) break ;;
              *) sleep 5 ;;
            esac
          done
          echo "----- remote stdout -----"
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "----- remote stderr -----"
          aws ssm get-command-invocation \
            --region "$REGION" \
            --command-id "$CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          [ "$STATUS" = "Success" ] || { echo "Reload status: $STATUS"; exit 1; }
