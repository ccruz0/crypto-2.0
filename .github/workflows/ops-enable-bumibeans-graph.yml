name: Ops — enable Bumi Beans Graph mail

# Flips secrets/brief_mailboxes.json bumibeans to provider=graph + enabled,
# re-renders runtime.env (Graph triad from SSM), recreates backend-aws, probes /api/brief/mail.
#
# AWS-RunShellScript uses /bin/sh. Match ops-restart-frontend-aws.yml:
# pass REMOTE via jq --arg (no bash -lc / printf %q nesting).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  enable-bumi:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Enable Bumi via SSM
        env:
          INSTANCE_ID: i-087953603011543c5
          COMPOSE_DIR: /home/ubuntu/crypto-2.0
        run: |
          set -euo pipefail
          # Same SSM quoting pattern as ops-restart-frontend-aws.yml (proven on prod).
          read -r -d '' REMOTE <<EOF || true
          set -eu
          COMPOSE_DIR="${COMPOSE_DIR}"
          cd "\$COMPOSE_DIR"
          echo "=== git sync main as ubuntu ==="
          sudo -u ubuntu git -C "\$COMPOSE_DIR" fetch origin main
          sudo -u ubuntu git -C "\$COMPOSE_DIR" checkout main
          sudo -u ubuntu git -C "\$COMPOSE_DIR" pull --ff-only origin main
          sudo -u ubuntu git -C "\$COMPOSE_DIR" rev-parse --short HEAD
          chmod +x "\$COMPOSE_DIR/scripts/aws/enable_bumibeans_graph.sh"
          bash "\$COMPOSE_DIR/scripts/aws/enable_bumibeans_graph.sh"
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "enable Bumi Beans Graph mail" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --region ap-southeast-1 \
            --query Command.CommandId --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-southeast-1 \
              --query Status --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardOutputContent --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardErrorContent --output text || true
          test "$STATUS" = "Success"
