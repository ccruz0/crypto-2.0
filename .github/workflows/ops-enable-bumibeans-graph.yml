name: Ops — enable Bumi Beans Graph mail

# Flips secrets/brief_mailboxes.json bumibeans to provider=graph + enabled,
# re-renders runtime.env (Graph triad from SSM), recreates backend-aws, probes /api/brief/mail.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enable-bumi:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Enable Bumi via SSM
        env:
          INSTANCE_ID: i-087953603011543c5
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --parameters 'commands=["set -euo pipefail","cd /home/ubuntu/crypto-2.0","git fetch origin main","git checkout main","git pull --ff-only origin main","chmod +x scripts/aws/enable_bumibeans_graph.sh","bash scripts/aws/enable_bumibeans_graph.sh"]' \
            --region ap-southeast-1 \
            --query Command.CommandId --output text)
          echo "COMMAND_ID=$COMMAND_ID"
          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ap-southeast-1 \
              --query Status --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardOutputContent --output text
          ERR=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query StandardErrorContent --output text || true)
          echo "STDERR:$ERR"
          FINAL=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ap-southeast-1 \
            --query Status --output text)
          test "$FINAL" = "Success"
