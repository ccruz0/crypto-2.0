# Arm squash auto-merge on PRs to main, including Cloud Agent drafts.
#
# Why this exists:
#   Cursor Cloud opens PRs as drafts. GitHub auto-merge cannot be enabled on a
#   draft, so the previous `if: draft == false` job skipped them. Bugbot inline
#   threads then keep mergeStateStatus BLOCKED because protect-main-production
#   requires conversation resolution. This workflow marks the PR ready, enables
#   auto-merge, resolves leftover bot-only threads, and squash-merges when
#   Path Guard is green.
#
# Still required: repo Settings → General → Pull Requests → Allow auto-merge.
# Path-guard failures and human review threads still block merge.
#
# The merge is made with a GitHub App installation token (app
# atp-auto-merge-ccruz0, installed only on this repo) instead of GITHUB_TOKEN,
# so the resulting push to main DOES trigger deploy-backend. See the step below.
#
# The check_run trigger fires on ANY completed check (except this job's own,
# which would loop). The script now refuses to merge while the head commit has
# checks in flight, so it needs waking up when the last one lands — watching
# only path-guard would leave the PR unmerged forever. See issue #498.
name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: >
      (
        github.event_name != 'check_run' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'check_run' &&
        github.event.check_run.name != 'enable-auto-merge' &&
        github.event.check_run.pull_requests[0].number != null
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A merge pushed with GITHUB_TOKEN does NOT trigger downstream workflows:
      # GitHub suppresses events created with it to prevent recursion. That is
      # why every bot merge left main undeployed and each deploy had to be
      # dispatched by hand (#498 point 3). An App installation token is not
      # subject to that guard, so the push to main fires deploy-backend.
      #
      # Deliberately NO fallback to GITHUB_TOKEN: falling back silently would
      # restore the invisible no-deploy bug. Failing loudly here is the point.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.AUTO_MERGE_APP_ID }}
          private-key: ${{ secrets.AUTO_MERGE_APP_PRIVATE_KEY }}

      - name: Ready draft, arm auto-merge, squash when green
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_PAGER: cat
          NO_COLOR: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
          # Long enough to outlast the slowest check in one run. With 90s the
          # script gave up mid-trivy (~90s) and left the PR open waiting for a
          # re-trigger. Measured on PR #500: everything else lands in ~10s.
          AUTO_MERGE_POLL_SECONDS: "600"
        run: python3 scripts/github_auto_merge.py
