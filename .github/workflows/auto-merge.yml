# Arm squash auto-merge on PRs to main, including Cloud Agent drafts.
#
# Why this exists:
#   Cursor Cloud opens PRs as drafts. GitHub auto-merge cannot be enabled on a
#   draft, so the previous `if: draft == false` job skipped them. Bugbot inline
#   threads then keep mergeStateStatus BLOCKED because protect-main-production
#   requires conversation resolution. This workflow marks the PR ready, enables
#   auto-merge, resolves leftover bot-only threads, and squash-merges when
#   Path Guard is green.
#
# Still required: repo Settings → General → Pull Requests → Allow auto-merge.
# Path-guard failures and human review threads still block merge.
#
# The check_run trigger fires on ANY completed check (except this job's own,
# which would loop). The script now refuses to merge while the head commit has
# checks in flight, so it needs waking up when the last one lands — watching
# only path-guard would leave the PR unmerged forever. See issue #498.
name: Enable auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
    branches: [main]
  pull_request_review:
    types: [submitted, dismissed]
  check_run:
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
  cancel-in-progress: false

jobs:
  enable-auto-merge:
    if: >
      (
        github.event_name != 'check_run' &&
        github.event.pull_request.base.ref == 'main' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.state == 'open'
      ) || (
        github.event_name == 'check_run' &&
        github.event.check_run.name != 'enable-auto-merge' &&
        github.event.check_run.pull_requests[0].number != null
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ready draft, arm auto-merge, squash when green
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_PAGER: cat
          NO_COLOR: "1"
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
          AUTO_MERGE_POLL_SECONDS: "90"
        run: python3 scripts/github_auto_merge.py
