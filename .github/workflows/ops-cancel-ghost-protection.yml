# Ops: cancel ghost/orphan SL/TP legs from Expected TP banner
# (ALGO/SUI/APT/AAVE by default — same rules as compute_protection_leg_stats).
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN (same as deploy-backend; static access keys are stale).
name: Ops — cancel ghost protection alerts

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, only dry-run (no exchange cancels)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      bases:
        description: "Comma-separated bases (empty = ALGO,SUI,APT,AAVE)"
        required: false
        default: "ALGO,SUI,APT,AAVE"
      git_ref:
        description: "Git ref on EC2 to checkout script from"
        required: false
        default: "main"

permissions:
  id-token: write
  contents: read

jobs:
  cancel-ghost-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Cancel ghost protection on prod
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          BASES: ${{ github.event.inputs.bases }}
        run: |
          set -euo pipefail
          LIVE_FLAG=""
          STALE_FLAG=""
          if [ "$DRY_RUN" != "true" ]; then
            LIVE_FLAG="--live"
            # Prod open-orders sync often reports stale_cache_db_fallback even when
            # data_verified=true; ops needs an explicit override for live cancels.
            STALE_FLAG="--allow-stale"
          fi
          REF="${GIT_REF:-main}"
          BASES_FLAG="--bases ${BASES:-ALGO,SUI,APT,AAVE}"
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin "$REF"
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q "origin/$REF" -- \
            backend/scripts/cancel_ghost_protection_alerts.py \
            backend/scripts/cancel_duplicate_sl_tp.py \
            backend/app/services/dashboard_position_counts.py \
            backend/app/services/ghost_protection.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER REF=$REF
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" python3 /repo/backend/scripts/cancel_ghost_protection_alerts.py ${LIVE_FLAG} ${STALE_FLAG} ${BASES_FLAG}
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "cancel ghost protection dry_run=${DRY_RUN} bases=${BASES}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
