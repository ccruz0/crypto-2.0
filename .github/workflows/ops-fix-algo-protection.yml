# Ops: audit/heal ALGO_USD protection (wallet-aware).
# Refuses short BUY SL/TP while ALGO wallet is net long (false "Lots short" orphans).
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN (static access keys retired).
name: Ops — fix ALGO protection

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, only dry-run"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write

jobs:
  fix-algo-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Audit / heal ALGO protection on prod
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
        run: |
          set -euo pipefail
          LIVE_FLAG=""
          if [ "$DRY_RUN" != "true" ]; then
            LIVE_FLAG="--live"
          fi
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin main
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- \
            backend/scripts/fix_algo_protection.py \
            backend/app/services/dashboard_position_counts.py \
            backend/app/services/logic_watchdog.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" python3 /repo/backend/scripts/fix_algo_protection.py ${LIVE_FLAG}
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "fix ALGO protection dry_run=${DRY_RUN}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text
          test "$STATUS" = "Success"
