# Ops: reconstruccion DIARIA de trade_outcomes.
#
# POR QUE EXISTE (2026-08-21):
# Hasta hoy el unico llamador de build_trade_outcomes.py era
# ops-auto-ml-hybrid-retrain.yml, que corre los LUNES a las 05:00 UTC y ademas
# reentrena y puede promocionar el modelo ML. Consecuencias medidas:
#   - El P&L real solo era observable una vez por semana, con hasta 7 dias de
#     retraso. El 21-ago la tabla llevaba desde el 17-ago sin escribirse.
#   - Las perdidas entraban en el dataset del modelo mas tarde que las
#     ganancias, sesgando el entrenamiento hacia el optimismo.
#
# QUE HACE ESTE WORKFLOW: solo reconstruye trade_outcomes. Nada mas.
#   - NO reentrena el modelo.
#   - NO promociona current.joblib.
#   - NO toca configuracion ni ordenes.
# Es de solo-medicion a proposito: el acoplamiento entre "medir" y "reentrenar"
# es lo que hacia que medir a diario fuese arriesgado.
#
# CONTEXTO DE USO: el 21-ago se cambio SL/TP a 3%/3% en los 29 simbolos. La
# metrica de seguimiento ya NO es el % de acierto sino el P&L por operacion,
# y necesita lectura diaria para poder juzgar el cambio en ~2 semanas.

name: Ops — trade_outcomes diario

on:
  schedule:
    # Todos los dias 04:30 UTC — 30 min antes del retrain del lunes, para que
    # cuando ese corra ya encuentre la tabla al dia.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Dias de historico a reconstruir"
        required: false
        default: "30"
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: trade-outcomes-daily
  cancel-in-progress: false

jobs:
  rebuild-trade-outcomes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Rebuild trade_outcomes on prod host
        env:
          INSTANCE_ID: i-087953603011543c5
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          set -euo pipefail
          REMOTE=$(cat <<EOF
          set -euo pipefail
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q origin/main -- scripts/build_trade_outcomes.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" bash -lc 'set -euo pipefail; cd /repo; python3 scripts/build_trade_outcomes.py --database-url "\$DATABASE_URL" --days ${DAYS} --out /tmp/trade-outcomes-daily.json --write-db'
          EOF
          )
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Rebuild trade_outcomes days=${DAYS} event=${{ github.event_name }}" \
            --parameters "$PARAMS" \
            --timeout-seconds 900 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"

          for i in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) echo "SSM status=$STATUS"; break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text | tail -20
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text | tail -20

          FINAL=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text)
          echo "Final status: $FINAL"
          test "$FINAL" = "Success"
