# Ops: restart frontend-aws on prod (fixes nginx 503 when port 3000 is down).
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN (static access keys retired).
name: Ops — restart frontend-aws

on:
  workflow_dispatch:
    inputs:
      skip_pull:
        description: "If true, skip ECR pull (only restart existing local image)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  id-token: write

jobs:
  restart-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Restart frontend-aws on prod via SSM
        env:
          INSTANCE_ID: i-087953603011543c5
          COMPOSE_DIR: /home/ubuntu/crypto-2.0
          PULL_ECR: ${{ github.event.inputs.skip_pull == 'true' && 'false' || 'true' }}
        run: |
          set -euo pipefail
          read -r -d '' REMOTE <<EOF || true
          set -eu
          COMPOSE_DIR="${COMPOSE_DIR}"
          cd "\$COMPOSE_DIR"
          echo "=== git pull (compose + env) as ubuntu ==="
          sudo -u ubuntu git -C "\$COMPOSE_DIR" fetch origin main
          sudo -u ubuntu git -C "\$COMPOSE_DIR" checkout main
          sudo -u ubuntu git -C "\$COMPOSE_DIR" pull --ff-only origin main
          echo "=== BEFORE ==="
          docker compose --profile aws ps frontend-aws || true
          echo ""
          echo "=== Localhost :3000 ==="
          curl -sS -o /dev/null -w "before http_code=%{http_code}\n" http://127.0.0.1:3000/ 2>/dev/null || echo "before: not reachable"
          REGION=ap-southeast-1
          REGISTRY=634531197711.dkr.ecr.ap-southeast-1.amazonaws.com
          IMAGE_URI="\${REGISTRY}/atp-frontend:latest"
          if [ -f .env ] && grep -q '^FRONTEND_IMAGE=' .env; then
            IMAGE_URI=\$(grep '^FRONTEND_IMAGE=' .env | tail -1 | cut -d= -f2-)
          fi
          if [ "${PULL_ECR}" = "true" ]; then
            echo "=== ECR login + pull \${IMAGE_URI} ==="
            aws ecr get-login-password --region "\$REGION" | docker login --username AWS --password-stdin "\$REGISTRY"
            docker pull "\$IMAGE_URI"
          else
            echo "=== Skip ECR pull (restart local image only) ==="
          fi
          echo "=== Start frontend-aws (\${IMAGE_URI}) ==="
          FRONTEND_IMAGE="\$IMAGE_URI" IMAGE="\$IMAGE_URI" docker compose --profile aws up -d --no-deps frontend-aws
          ok=0
          for i in \$(seq 1 30); do
            code=\$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/ 2>/dev/null || echo 000)
            echo "probe \$i http_code=\$code"
            if [ "\$code" = "200" ] || [ "\$code" = "304" ]; then ok=1; break; fi
            sleep 2
          done
          echo ""
          echo "=== AFTER ==="
          docker compose --profile aws ps frontend-aws || true
          docker compose --profile aws logs --tail=40 frontend-aws || true
          if [ "\$ok" != "1" ]; then
            echo "FAIL: frontend not healthy on :3000 after restart"
            exit 1
          fi
          echo "OK: frontend responding on http://127.0.0.1:3000/"
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "restart frontend-aws pull_ecr=${PULL_ECR}" \
            --parameters "$PARAMS" \
            --timeout-seconds 600 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 80); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
