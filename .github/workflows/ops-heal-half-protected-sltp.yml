# Ops: repair SL-only (half-protected) parents via ensure_missing_protection on prod.
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN (same as deploy-backend; static access keys are stale).
# Requires backend image with SLTP_HALF_PROTECTED_HEAL_ENABLED path (#451+).
name: Ops — heal half-protected SL/TP

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, only dry-run (LIVE_TRADING forced false for heal)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  id-token: write
  contents: read

jobs:
  heal-half-protected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Heal half-protected SL/TP on prod
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
        run: |
          set -euo pipefail
          # Build remote script carefully: AWS-RunShellScript uses /bin/sh.
          # Avoid nested heredocs; write a temp .py then docker exec it.
          REMOTE=$(cat <<EOF
          set -eu
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER DRY_RUN=${DRY_RUN}
          test -n "\$CONTAINER"
          cat > /tmp/ops_half_protected_heal.py <<'PY'
          import json, os
          from app.database import SessionLocal
          from app.services.sl_tp_checker import sl_tp_checker_service

          dry = os.environ.get("OPS_DRY_RUN", "true").strip().lower() in ("1", "true", "yes", "on")
          if dry:
              os.environ["LIVE_TRADING"] = "false"
          db = SessionLocal()
          try:
              result = sl_tp_checker_service.ensure_missing_protection(db)
              summary = {
                  "dry_run": dry,
                  "half_protected_heal_only": result.get("half_protected_heal_only"),
                  "healing_disabled": result.get("healing_disabled"),
                  "created_n": len(result.get("created") or []),
                  "failed_n": len(result.get("failed") or []),
                  "skipped_n": len(result.get("skipped") or []),
                  "still_missing_n": len(result.get("still_missing") or []),
                  "created": (result.get("created") or [])[:40],
                  "failed": (result.get("failed") or [])[:40],
              }
              print(json.dumps(summary, default=str, indent=2))
          finally:
              db.close()
          PY
          docker cp /tmp/ops_half_protected_heal.py "\$CONTAINER":/tmp/ops_half_protected_heal.py
          docker exec -e OPS_DRY_RUN=${DRY_RUN} "\$CONTAINER" python3 /tmp/ops_half_protected_heal.py
          EOF
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "heal half-protected SL/TP dry_run=${DRY_RUN}" \
            --parameters "$PARAMS" \
            --timeout-seconds 900 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 100); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "[Status,StandardOutputContent,StandardErrorContent]" \
            --output text
          test "$STATUS" = "Success"
