# Ops: repair SL-only (half-protected) parents via ensure_missing_protection on prod.
# Auth: OIDC via AWS_DEPLOY_ROLE_ARN (same as deploy-backend; static access keys are stale).
# Requires backend image with SLTP_HALF_PROTECTED_HEAL_ENABLED path (#451+).
name: Ops — heal half-protected SL/TP

on:
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: "If true, only dry-run (LIVE_TRADING forced false for heal)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      symbols:
        description: "Comma-separated symbols (empty = full book). Prefer ETH_USD,ETH_USDT for live."
        required: false
        default: "ETH_USD,ETH_USDT"
      git_ref:
        description: "Git ref on EC2 to checkout script from"
        required: false
        default: "main"

permissions:
  id-token: write
  contents: read

jobs:
  heal-half-protected:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Heal half-protected SL/TP on prod
        env:
          INSTANCE_ID: i-087953603011543c5
          DRY_RUN: ${{ github.event.inputs.dry_run_only }}
          GIT_REF: ${{ github.event.inputs.git_ref }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          set -euo pipefail
          LIVE_FLAG=""
          if [ "$DRY_RUN" != "true" ]; then
            LIVE_FLAG="--live"
          fi
          REF="${GIT_REF:-main}"
          SYMBOLS_FLAG=""
          if [ -n "${SYMBOLS:-}" ]; then
            SYMBOLS_FLAG="--symbols ${SYMBOLS}"
          fi
          # Use read+heredoc (not $(cat <<EOF)): nested ) in Python broke command substitution (#453).
          read -r -d '' REMOTE <<EOF || true
          set -eu
          cd /home/ubuntu/crypto-2.0
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 fetch origin "$REF"
          sudo -u ubuntu git -C /home/ubuntu/crypto-2.0 checkout -q "origin/$REF" -- \
            backend/scripts/ops_heal_half_protected_sltp.py
          CONTAINER=\$(docker ps -q --filter "name=backend-aws-1" | head -1)
          echo CONTAINER=\$CONTAINER REF=$REF DRY_RUN=${DRY_RUN} SYMBOLS=${SYMBOLS:-}
          test -n "\$CONTAINER"
          docker exec "\$CONTAINER" python3 /repo/backend/scripts/ops_heal_half_protected_sltp.py ${LIVE_FLAG} ${SYMBOLS_FLAG}
          EOF
          # Do not set Parameters.executionTimeout: AWS CLI requires a StringList and
          # document defaults are already 3600s. Rely on --timeout-seconds below.
          PARAMS=$(jq -n --arg cmd "$REMOTE" '{commands: [$cmd]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "heal half-protected SL/TP dry_run=${DRY_RUN} symbols=${SYMBOLS:-}" \
            --parameters "$PARAMS" \
            --timeout-seconds 1800 \
            --output text \
            --query "Command.CommandId")
          echo "CommandId=$COMMAND_ID"
          for i in $(seq 1 240); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo InProgress)
            echo "status=$STATUS ($i)"
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          echo "===== STDOUT ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardOutputContent" --output text || true
          echo "===== STDERR ====="
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "StandardErrorContent" --output text || true
          test "$STATUS" = "Success"
