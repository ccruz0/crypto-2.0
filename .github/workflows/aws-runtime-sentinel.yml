name: AWS Runtime Sentinel

on:
  push:
    branches: [main]
  schedule:
    # 09:21 and 16:21 Asia/Makassar (UTC+8) — JARVIS twice-daily prod check via OIDC
    - cron: "21 1,8 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Verification mode (auto = prod-check on schedule, sentinel otherwise)
        required: false
        default: auto
        type: choice
        options:
          - auto
          - sentinel
          - prod-check

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  verify-production-runtime:
    name: Verify production runtime
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-1
      AWS_DEFAULT_REGION: ap-southeast-1
      AWS_RUNTIME_VERIFY_MODE: >-
        ${{ inputs.mode == 'prod-check' && 'prod-check'
            || (inputs.mode == 'sentinel' && 'sentinel'
            || (github.event_name == 'schedule' && 'prod-check' || 'sentinel')) }}
      AWS_RUNTIME_VERIFY_QUIET: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Run AWS runtime verification
        id: verify
        run: |
          python scripts/aws_runtime_verify.py
          EXIT=$?
          echo "exitcode=${EXIT}" >> "$GITHUB_OUTPUT"
          exit "$EXIT"

      - name: Mark critical on violation
        if: failure() && steps.verify.outputs.exitcode == '2'
        run: |
          echo "::error::CRITICAL RUNTIME VIOLATION - Production runtime verification failed (exit 2). Block deployment until resolved."
          echo "## CRITICAL RUNTIME VIOLATION" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment is blocked. Resolve runtime violations (SSM unreachable, duplicate pollers, port exposure, or other critical checks) before deploying." >> "$GITHUB_STEP_SUMMARY"
