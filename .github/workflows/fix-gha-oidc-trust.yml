# One-shot: apply IAM OIDC trust so environment:production deploys can AssumeRoleWithWebIdentity.
# Uses static repo AWS keys (same pattern as restart_nginx / ops workflows). No trading.
name: Fix GHA OIDC trust (environment:production)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1
      - name: Update gha-deploy-frontend assume-role policy
        run: |
          set -euo pipefail
          aws iam update-assume-role-policy \
            --role-name gha-deploy-frontend \
            --policy-document file://ci-cd/iam/trust-gha-deploy-frontend.json
          echo "Updated trust policy:"
          aws iam get-role --role-name gha-deploy-frontend \
            --query 'Role.AssumeRolePolicyDocument' --output json
