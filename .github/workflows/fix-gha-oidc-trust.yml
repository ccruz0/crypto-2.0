# One-off: update gha-deploy-frontend trust policy for GitHub environment: production OIDC sub.
# Run manually after merge; uses static IAM user keys (can update trust before OIDC works).
name: Fix GHA OIDC trust (gha-deploy-frontend)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-trust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials (static keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update gha-deploy-frontend assume-role policy
        run: |
          set -euo pipefail
          aws iam update-assume-role-policy \
            --role-name gha-deploy-frontend \
            --policy-document file://ci-cd/iam/trust-gha-deploy-frontend.json

      - name: Verify assume-role policy
        run: |
          set -euo pipefail
          aws iam get-role --role-name gha-deploy-frontend \
            --query 'Role.AssumeRolePolicyDocument'
