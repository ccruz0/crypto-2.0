# Phase 2 (P2-R5) CI gate + Signals/SL-TP surface (added 2026-08-21).
#
# SCOPE — READ BEFORE TRUSTING THIS GATE AS "THE TESTS":
# This is a CURATED subset, not the repository's full test suite. The full
# suite includes environment-dependent tests (live DB, docker, network) that
# fail on a bare GitHub runner and were already failing on main before Phase 2
# (documented in the Phase 2 delivery evidence: pre_existing_failures_on_main.txt).
#
# Two curated surfaces run here:
#   1. Jarvis/planner/router/cost-tracker (Phase 2, unchanged).
#   2. Signals & SL/TP (added 2026-08-21) — 47 tests, verified green twice in a
#      row against the production image before being added.
#
# WHY THE SIGNALS SURFACE MATTERS:
# backend/app/services/signal_monitor.py decides every real-money order and is
# NOT covered by path-guard. Until 2026-08-21 no CI gate executed any signal
# test at all. This job closes part of that hole.
#
# KNOWN-RED, DELIBERATELY EXCLUDED (measured 2026-08-21, NOT speculation):
#   tests/test_buy_signal_logic.py          — 7 failures
#   tests/test_trading_signals_canonical.py — 3 failures
#     Both fail on `buy_volume_ok` returning False where the test expects None
#     ("not evaluated" vs "evaluated and failed"). The test encodes the correct
#     intent; the code drifted. Fixing this is a business-rules decision, not a
#     CI one. THESE ARE THE TWO FILES COVERING should_trigger_buy_signal —
#     the most important function in the repo is still uncovered by this gate.
#   tests/test_signal_monitor_alert_flags.py       — 4 failures
#   tests/test_exchange_sync_build_strategy_key.py — 1 failure
#   tests/test_trading_config_path.py              — 1 failure
#
# Do NOT add files to the signals job without running them first. A red gate
# teaches everyone to ignore the gate.

name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  jarvis-surface-curated-not-full-suite:
    name: "Jarvis/Planner surface tests (curated subset — NOT the full backend suite)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint app/jarvis (ruff — error-class rules only)
        run: python -m ruff check app/jarvis --select E9,F63,F7,F82

      - name: Curated Jarvis surface (15 files, NOT full backend/tests)
        run: |
          python -m pytest -q \
            tests/test_phase2_router_and_costs.py \
            tests/test_jarvis_aws_auditor.py \
            tests/test_jarvis_autonomous_mission.py \
            tests/test_jarvis_action_policy_safety.py \
            tests/test_jarvis_crypto_auditor.py \
            tests/test_jarvis_hardening.py \
            tests/test_jarvis_ops_agent.py \
            tests/test_jarvis_orchestrator_goal_retry.py \
            tests/test_jarvis_planner_local_intent.py \
            tests/test_jarvis_task_mvp.py \
            tests/test_jarvis_wallet_reconciliation.py \
            tests/test_mission_goal_quality.py \
            tests/test_planner_input_gate.py \
            tests/test_planner_marketing_intent.py \
            tests/test_strategy_google_ads_injection.py \
            --deselect tests/test_jarvis_orchestrator_goal_retry.py::test_google_ads_stays_shallow_after_retry_waits_for_input_not_done \
            --deselect tests/test_jarvis_orchestrator_goal_retry.py::test_planner_requires_input_sends_natural_clarification_not_rigid_block \
            --deselect tests/test_jarvis_ops_agent.py::test_orchestrator_includes_ops_output_and_logs_to_notion

  signals-and-sltp-surface-partial:
    name: "Signals & SL/TP surface (13 files, 47 tests — does NOT cover should_trigger_buy_signal)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Signals & SL/TP tests (verified green twice on 2026-08-21)
        run: |
          python -m pytest -q --timeout=90 \
            tests/test_signal_indicator_snapshot.py \
            tests/test_sell_trend_filter_direction.py \
            tests/test_buy_decision_index_alignment.py \
            tests/test_signal_indicators.py \
            tests/test_strategy_consistency.py \
            tests/test_sl_tp_price_adjust.py \
            tests/test_signal_order_policy.py \
            tests/test_resolve_strategy_profile.py \
            tests/test_signal_monitor_rsi_fstring.py \
            tests/test_signal_monitor_limits.py \
            tests/test_legacy_sell_guardrails.py \
            tests/test_governance_trading_only_guard.py \
            tests/test_clamp_sell_alert.py
