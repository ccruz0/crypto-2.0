groups:
  - name: base
    rules:
      - alert: InstanceDown
        expr: up == 0
        for: 15m
        labels: { severity: "critical" }
        annotations:
          summary: "Target down: {{ $labels.job }} {{ $labels.instance }}"
          description: "Scrape target {{ $labels.job }} {{ $labels.instance }} has been down for more than 15m."

      - alert: HostDiskFillingUp
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) < 0.15
        for: 10m
        labels: { severity: "warning" }
        annotations:
          summary: "Disk low on {{ $labels.instance }} ({{ $labels.mountpoint }})"
          description: "Filesystem {{ $labels.mountpoint }} has less than 15% space available for 10m."

      - alert: ContainerRestartsHigh
        # changes(), no increase(): container_start_time_seconds es un gauge que
        # guarda la marca Unix de arranque. increase() sobre una marca temporal
        # suma segundos, no reinicios — disparaba con ~899,97 (los 900 s de la
        # ventana) sobre unidades de systemd. changes() cuenta cuantas veces
        # cambio el valor, que es exactamente un reinicio.
        # name!="": excluye los cgroups del sistema, deja solo contenedores.
        expr: changes(container_start_time_seconds{name!=""}[15m]) > 2
        for: 5m
        labels: { severity: "warning" }
        annotations:
          summary: "Container restarts detected (cadvisor)"
          description: "One or more containers restarted more than twice in the last 15m."

      - alert: HostMemoryHigh
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 5m
        labels: { severity: "warning" }
        annotations:
          summary: "Host memory low on {{ $labels.instance }} (<10% available)"
          description: "Available memory has been below 10% for 5m. Host is memory-pressured and may start swapping."

      - alert: HostMemoryCritical
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.05
        for: 5m
        labels: { severity: "critical" }
        annotations:
          summary: "Host memory critical on {{ $labels.instance }} (<5% available)"
          description: "Available memory has been below 5% for 5m. OOM-kills and severe swap thrashing are likely."

      - alert: HostSwapHigh
        expr: ((node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) / clamp_min(node_memory_SwapTotal_bytes, 1)) > 0.25
        for: 10m
        labels: { severity: "warning" }
        annotations:
          summary: "Host swap usage high on {{ $labels.instance }} (>25% used)"
          description: "More than 25% of swap has been in use for 10m, indicating sustained memory pressure / thrashing."

      - alert: HostCPUSaturated
        expr: (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 0.85
        for: 10m
        # critical: severity=warning se enruta al receptor `null` (alertmanager.yml,
        # PR #148), asi que esta alerta no llegaba a nadie. El 3-sep estuvo 32 h
        # al 99,99 % sin avisar mientras el backend se reiniciaba solo.
        labels: { severity: "critical" }
        annotations:
          summary: "Host CPU saturated on {{ $labels.instance }} (>85% non-idle)"
          description: "Non-idle CPU has averaged above 85% for 10m, indicating sustained CPU saturation."

  - name: backend_api
    rules:
      - alert: BackendHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="backend",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total{job="backend"}[5m])), 1e-9)
          ) > 0.02
        for: 5m
        labels: { severity: "critical" }
        annotations:
          summary: "Backend 5xx rate > 2%"
          description: "5xx response rate on backend exceeded 2% over the last 5m."

      - alert: BackendP95LatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="backend"}[5m]))) > 0.8
        for: 10m
        labels: { severity: "warning" }
        annotations:
          summary: "Backend p95 latency > 800ms"
          description: "95th percentile HTTP request latency on backend exceeded 800ms for 10m."

      - alert: MarketUpdaterStalled
        expr: max(market_updater_heartbeat_age_seconds{job="market_updater"}) > 900
        for: 5m
        # critical: un market updater parado deja al bot operando con precios
        # viejos. Es de las pocas condiciones que exigen mirar el sistema ya.
        labels: { severity: "critical" }
        annotations:
          summary: "Market updater heartbeat age > 15m"
          description: "Market updater has not sent a heartbeat in over 15 minutes."

      - alert: ApprovalQueueStale
        expr: approval_queue_stale_total > 0
        for: 30m
        labels: { severity: "warning" }
        annotations:
          summary: "Telegram agent approval queue has stale pending tasks"
          description: "One or more Telegram agent approval tasks (agent_approval_states) have been pending longer than the configured stale threshold (default 24h). Resolve or let the 7-day expire job clean them up."

      - alert: JarvisApprovalQueueStale
        expr: jarvis_approval_queue_stale_total > 0
        for: 30m
        labels: { severity: "warning" }
        annotations:
          summary: "Jarvis Approval Center has stale waiting tasks"
          description: "One or more ACW tasks (jarvis_task_runs in waiting_for_approval / waiting_for_pr_approval) are older than the configured stale threshold (default 24h). Review /jarvis/approval and approve, reject, or cancel them."

      # Exposicion que el contador legacy no ve. Medido el 5-sep-2026: 12 de 22
      # simbolos dan cuenta 0 con lotes reales detras, porque el numerador exige
      # trade_signal_id y trade_signals dejo de escribirse en julio. Eran $111,41
      # sobre $48.412 de equity, de los cuales $97,90 en un solo simbolo (DOGE),
      # y no crecia (+$0,18/dia). El polvo (<$5) queda excluido por politica.
      # Los umbrales salen de esa medicion, no de una regla general.
      - alert: BlindExposureHigh
        expr: blind_exposure_usd_total > 484
        for: 30m
        # warning y no critical: la cifra medida no crecia y no hay accion
        # automatica que tomar. Exige mirar, no despertarse.
        labels: { severity: "warning" }
        annotations:
          summary: "Exposicion invisible al contador de posiciones > $484 (1% del equity)"
          description: "blind_exposure_usd_total lleva 30m por encima de $484. Son posiciones abiertas que el contador legacy reporta como cero, asi que maxOpenOrdersPerCoin y maxOpenOrdersTotal no las estan limitando. Ver docs/project-history/contador-medicion-2026-09-05.md."

      - alert: BlindExposureSymbolHigh
        expr: blind_exposure_max_symbol_usd > 100
        for: 30m
        labels: { severity: "warning" }
        annotations:
          summary: "Una sola posicion invisible al contador supera los $100"
          description: "blind_exposure_max_symbol_usd lleva 30m por encima de $100. En la medicion del 5-sep DOGE estaba en $97,90, al 98% de este gatillo: si salta, esa posicion ha crecido. Los cortos tienen freno de wallet (wallet_has_material_short); los largos no."

      - alert: BlindExposureWatchdogBlind
        expr: blind_exposure_errors_total > 0
        for: 1h
        # Sin esta, un vigilante roto se lee como "no hay exposicion", que es
        # justo el fallo que el vigilante existe para impedir.
        labels: { severity: "warning" }
        annotations:
          summary: "El vigilante de exposicion ciega no pudo evaluar algun simbolo"
          description: "blind_exposure_errors_total > 0 durante 1h: el vigilante corre pero deja simbolos sin medir, asi que blind_exposure_usd_total esta subestimado. Revisar los logs [BLIND_EXPOSURE] del backend."
